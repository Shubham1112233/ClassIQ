<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClassIQ — Dashboard</title>
<meta name="description" content="Browse all ClassIQ courses and enroll in your favourites.">
<link rel="icon" href="assets/icons/logo-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&family=Nunito+Sans:wght@600&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="index.html">
      <img src="assets/icons/logo-mark.svg" alt="" width="49" height="49">
      <span class="brand-name">ClassIQ</span>
    </a>

    <button class="nav-toggle" aria-expanded="false" aria-controls="primary-nav" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>

    <nav class="primary-nav" id="primary-nav">
      <ul class="nav-links">
        <li><a href="dashboard.html" aria-current="page">Dashboard</a></li>
      </ul>
      <div class="nav-actions">
        <a class="btn btn-dark" href="signin.html">Login</a>
        <a class="btn btn-dark" href="signup.html">SignUp</a>
      </div>
    </nav>
  </div>
</header>

<main id="main">
  <div class="container">
    <section class="banner">
      <h1 class="banner-title">Enroll in&nbsp; Your Fav Courses</h1>
      <picture>
        <source srcset="assets/images/dashboard-avatar.webp" type="image/webp">
        <img src="assets/images/dashboard-avatar.png" alt="Student working on a laptop"
             width="324" height="296" fetchpriority="high" decoding="async">
      </picture>
    </section>
  </div>

  <section class="all-courses">
    <div class="container">
      <div class="all-courses-head">
        <h2>All Courses</h2>
        <svg viewBox="0 0 24 24" width="25" height="22" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 15c0-4 3-7 8-7h8"/><path d="M15 4l5 4-5 4"/></svg>
      </div>
      <ul class="card-grid">
        <li class="placeholder-card"></li>
        <li class="placeholder-card"></li>
        <li class="placeholder-card"></li>
        <li class="placeholder-card"></li>
        <li class="placeholder-card"></li>
        <li class="placeholder-card"></li>
      </ul>
    </div>
  </section>
</main>

<script src="js/main.js?v=5"></script>
</body>
</html>
